[build-system]
# setuptools 77 is the first release that understands PEP 639 — the SPDX
# `license` expression and the `license-files` key used below. Earlier
# versions fail on them, so the floor is 77, not the historical 42.
# `wheel` is not listed: setuptools has built wheels without it since 70.1.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "aspose-slides-foss"
version = "26.8.0"
description = "Official open-source Python library by Aspose.Slides for creating, reading, and editing PowerPoint (.pptx) presentations. Designed for developers and AI agents."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Aspose" },
]
keywords = [
    "powerpoint",
    "pptx",
    "presentation",
    "slides",
    "aspose",
    "office",
    "openxml",
]
# No `License :: OSI Approved :: MIT License` classifier: PEP 639 replaced the
# license classifiers with the `license` expression above, and setuptools >= 77
# rejects a build that carries both. The expression is the machine-readable
# statement of the licence; the classifier would be a duplicate of it.
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "lxml>=4.9",
]

[project.optional-dependencies]
# Test-only. What stops a writer bug from being hidden by a matching reader bug
# is the conformance harness itself: it unzips the produced package and reads
# the XML with XPath, never asking this library to read its own output back.
# python-pptx is a second, independent reader the harness can call where one
# states a failure most clearly; one conformance test uses it, and that test
# skips if it is absent.
test = [
    "pytest>=7",
    "python-pptx>=1.0",
]

[project.urls]
Homepage = "https://github.com/aspose-slides-foss/Aspose.Slides-FOSS-for-Python"
Documentation = "https://github.com/aspose-slides-foss/Aspose.Slides-FOSS-for-Python#readme"
Repository = "https://github.com/aspose-slides-foss/Aspose.Slides-FOSS-for-Python"
Issues = "https://github.com/aspose-slides-foss/Aspose.Slides-FOSS-for-Python/issues"

[tool.setuptools.packages.find]
include = ["aspose.*"]
exclude = ["tests*", "examples*"]
namespaces = true

[tool.setuptools.package-data]
# `aspose` is a PEP 420 namespace package with no __init__.py, so the PEP 561
# marker belongs in the first regular package, aspose.slides_foss.
"*" = ["py.typed"]
"aspose.slides_foss._internal.pptx" = ["*.pptx"]
"aspose.slides_foss._internal.xlsx" = ["*.xlsx"]

[tool.mypy]
# The package ships a py.typed marker, so what mypy reports here is close to
# what a consumer's own checker reports about this library. Annotation coverage
# is partial, so this is not a clean-tree gate: CI records the error count and
# fails if it rises, which makes the number a ratchet rather than a wish.
#
# Both settings below exist so a local `mypy` and the CI run reach the same
# count. `ignore_missing_imports` keeps third-party stubs out of the total —
# they are not this project's errors. `python_version` is pinned because the
# count varies with the interpreter mypy analyses for, and a baseline that
# moves when the runner's default Python changes cannot be a ratchet. It does
# not narrow what the library supports; the test matrix is what states that.
packages = ["aspose.slides_foss"]
ignore_missing_imports = true
python_version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings are errors. The suite is clean under this setting, so anything new
# — a DeprecationWarning from a future runtime, a ResourceWarning from a file
# a test forgot to close — fails the build instead of scrolling past. If a
# third-party dependency starts warning about its own internals, add a
# narrowly targeted `ignore:...` line here rather than deleting the rule.
filterwarnings = ["error"]
