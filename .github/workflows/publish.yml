# Publish a release to PyPI.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS WORKFLOW CANNOT SUCCEED UNTIL A TRUSTED PUBLISHER IS CONFIGURED ON PyPI.
#
# There is no API token anywhere in this repository, by design. Authentication
# is PyPI Trusted Publishing: GitHub mints a short-lived OpenID Connect token
# for this job, PyPI checks its claims against a publisher the project owner
# registered, and exchanges it for an upload token that expires in minutes.
# Nothing long-lived exists to leak, and there is no secret to rotate.
#
# Until that publisher exists, the upload step fails with an
# `invalid-publisher` error. Register it at
# https://pypi.org/manage/project/aspose-slides-foss/settings/publishing/
# with exactly these values — every one of them is matched literally:
#
#     PyPI Project Name:  aspose-slides-foss
#     Owner:              aspose-slides-foss
#     Repository name:    Aspose.Slides-FOSS-for-Python
#     Workflow name:      publish.yml
#     Environment name:   pypi
#
# Then create a GitHub environment named `pypi` in this repository's settings.
# PUBLISHING.md explains the whole procedure and how to check it worked.
# ─────────────────────────────────────────────────────────────────────────────
#
# Actions are pinned to commit SHAs rather than tags for the reason given at
# the top of ci.yml: a tag can be moved to different code, a commit cannot.
# That matters more here than anywhere else in the repository, because this
# job holds the credential that can publish under this project's name.

name: Publish to PyPI

on:
  release:
    types: [published]
  # Lets a maintainer re-run the release after fixing the PyPI-side
  # configuration, without cutting a second release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Five seconds of checking, before the whole build. Everything here
  # is knowable from the ref alone, and every one of these failures used to
  # happen at the upload step instead — after the whole matrix had run.
  #
  #   * The version in pyproject.toml is already on PyPI. PyPI does not allow
  #     re-uploading a version, not even an identical file, so a release cut
  #     without bumping the version cannot succeed however long it runs.
  #   * The release tag does not name the version being built.
  #
  # It also closes the workflow_dispatch hole: the tag check further down is
  # scoped to `release` events, because a dispatch has no release tag, so a
  # dispatch on any ref used to publish whatever pyproject.toml happened to
  # say. The PyPI check below is not scoped, and it is the one that matters.
  preflight:
    name: pre-flight checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # tomllib is in the standard library from 3.11.
          python-version: "3.12"

      - name: Check the version is one PyPI will accept
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          version=$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "pyproject.toml version: $version"

          if [ "$EVENT" = "release" ]; then
            tag="${GITHUB_REF_NAME#v}"
            echo "release tag:            $tag"
            if [ "$version" != "$tag" ]; then
              echo "::error::release tag $GITHUB_REF_NAME does not name version $version from pyproject.toml" >&2
              exit 1
            fi
          fi

          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/aspose-slides-foss/$version/json")
          case "$code" in
            404)
              echo "$version is not on PyPI yet — good"
              ;;
            200)
              echo "::error::aspose-slides-foss $version is already on PyPI. PyPI refuses a re-upload of a version, identical file or not. Bump the version in pyproject.toml and cut a new release." >&2
              exit 1
              ;;
            *)
              echo "::error::could not ask PyPI whether $version exists (HTTP $code). Re-run this workflow." >&2
              exit 1
              ;;
          esac

  # The gate. This is the same CI that runs on every push, invoked as a
  # reusable workflow: it runs the full suite across the whole support matrix
  # and builds the distributions. If any of it fails, `publish` never starts,
  # and the artefact `publish` uploads is the one these jobs built and
  # inspected — not a rebuild that was never tested.
  #
  # This one `uses:` is a path rather than a SHA because GitHub requires that
  # form for a reusable workflow in the same repository; it resolves to the
  # copy of ci.yml at the commit being released, which is what should gate it.
  ci:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: upload to PyPI
    needs: ci
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/aspose-slides-foss

    permissions:
      # Lets GitHub mint the OIDC token that PyPI exchanges for upload rights,
      # and lets the publisher attach PEP 740 attestations to the files. This
      # is the only permission the job needs; `contents` stays read-only from
      # the workflow-level default above.
      id-token: write

    steps:
      - name: Download the distributions CI built
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist

      - name: Check the release tag matches the version being published
        # `preflight` compared the tag against pyproject.toml. This compares it
        # against the artefact about to be uploaded, which is the only thing
        # that can still disagree: a stale or hand-edited `dist/`. Publishing
        # 26.8.0 from a tag that says v26.9.0 produces a release nobody can
        # find and a version number that means nothing.
        if: github.event_name == 'release'
        run: |
          set -eu
          sdists=(dist/*.tar.gz)
          if [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one sdist in dist/, found ${#sdists[@]}" >&2
            exit 1
          fi
          # aspose_slides_foss-26.8.0.tar.gz -> 26.8.0. The project name uses
          # underscores in a filename, so the first hyphen is the separator.
          built=$(basename "${sdists[0]}" .tar.gz)
          built=${built#*-}
          tag="${GITHUB_REF_NAME#v}"
          echo "built version: $built"
          echo "release tag:   $tag"
          if [ "$built" != "$tag" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match built version $built" >&2
            exit 1
          fi

      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # PEP 740 provenance: a signed statement, verifiable on PyPI, that
          # these exact files came out of this workflow in this repository.
          # Releases published before this workflow existed have none, and
          # cannot be given any retroactively.
          attestations: true
          print-hash: true
